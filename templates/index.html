<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAMANG AI | MULTI-PASARAN V8.27</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --bg: #000; --card: #0a0a0a; --neon: #00ff41; --text: #fff; --danger: #ff0000; }
        body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        header { width: 100%; padding: 25px 0; text-align: center; border-bottom: 3px solid var(--neon); margin-bottom: 30px; }
        h1 { font-family: 'Orbitron', sans-serif; color: var(--neon); letter-spacing: 8px; font-size: 3rem; margin: 0; }
        .container { width: 95%; max-width: 1200px; }
        .selector-box { background: var(--card); padding: 25px; border: 2px solid #222; border-radius: 15px; display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; }
        select, button { background: #000; color: var(--neon); border: 2px solid var(--neon); padding: 15px 25px; border-radius: 8px; font-size: 1.3rem; font-weight: bold; cursor: pointer; }
        .btn-capture { background: #003b11; display: none; margin-bottom: 20px; }
        .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; display: none; padding: 15px; }
        .market-info { grid-column: 1 / -1; text-align: center; border: 3px solid var(--neon); padding: 25px; border-radius: 15px; background: rgba(0,255,65,0.05); }
        .card { background: var(--card); border: 1px solid #444; padding: 30px; border-radius: 15px; text-align: center; }
        .card-header { font-size: 1.2rem; color: #888; margin-bottom: 10px; }
        .card-value { font-size: 3.8rem; color: var(--neon); font-weight: 800; }
        .val-small { font-size: 2.5rem; }
        #loader { display: none; color: var(--neon); font-size: 1.5rem; }
    </style>
</head>
<body>
    <header><h1>MAMANG AI V8.27</h1></header>
    <div class="container">
        <div class="selector-box">
            <select id="mSelect">{% for m in markets %}<option value="{{m}}">{{m}}</option>{% endfor %}</select>
            <button onclick="start()">EXECUTE</button>
        </div>
        <center><button id="capBtn" class="btn-capture" onclick="takeScreenshot()">📸 DOWNLOAD PNG</button></center>
        <center><div id="loader">SYNCING DATA...</div></center>
        <div class="dashboard" id="captureArea">
            <div class="market-info">
                <span style="font-size:3rem; display:block;" id="r_market">-</span>
                <span style="font-size:2rem; color:var(--neon);">LAST: <b id="r_last">-</b></span>
            </div>
            <div class="card"><div class="card-header">CORE 2D</div><div class="card-value" id="r_core">-</div></div>
            <div class="card"><div class="card-header">BBFS</div><div class="card-value val-small" id="r_bbfs">-</div></div>
            <div class="card"><div class="card-header">AS+KOP</div><div class="card-value" id="r_askop">-</div></div>
            <div class="card"><div class="card-header">KOP+KEP</div><div class="card-value" id="r_kopkep">-</div></div>
            <div class="card"><div class="card-header">SHIO</div><div class="card-value" id="r_shio">-</div></div>
            <div class="card"><div class="card-header">MACAU/TWIN</div><div class="card-value val-small" id="r_macau">-</div><div class="val-small" style="color:red;" id="r_twin">-</div></div>
        </div>
    </div>
    <script>
        function start() {
            $('#loader').show(); $('#captureArea').hide(); $('#capBtn').hide();
            $.post('/analyze', { market: $('#mSelect').val() }, function(d) {
                $('#loader').hide();
                if(d.status==='success') {
                    $('#r_market').text(d.market); $('#r_last').text(d.last);
                    $('#r_core').text(d.data.core); $('#r_bbfs').text(d.data.bbfs);
                    $('#r_askop').text(d.data.as_kop); $('#r_kopkep').text(d.data.kop_kep);
                    $('#r_shio').text(d.data.shio); $('#r_macau').text(d.data.macau);
                    $('#r_twin').text(d.data.twin);
                    $('#captureArea').fadeIn().css('display', 'grid'); $('#capBtn').show();
                }
            });
        }
        function takeScreenshot() {
            html2canvas(document.getElementById('captureArea'), { backgroundColor: "#000", scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `PREDIKSI-${$('#r_market').text()}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
