<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAMANG PREDIKSI V8.1 - AUTO ANALYZE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; background-color: #0a0a0a; color: #00ff41; }
        .neon-border { border: 1px solid #00ff41; box-shadow: 0 0 10px #00ff41; }
        .btn-glow:hover { box-shadow: 0 0 20px #00ff41; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-2xl mx-auto">
        <header class="text-center mb-8 neon-border p-4 bg-black">
            <h1 class="text-2xl font-bold">MAMANG ANALYTICS V8.1</h1>
            <p class="text-xs text-gray-500">Auto-Scraper & Pattern Prediction Locked</p>
        </header>

        <div class="mb-6 flex gap-2">
            <select id="market" class="bg-black border border-green-500 text-green-500 p-2 flex-grow outline-none">
                {% for m in markets %}
                <option value="{{ m }}">{{ m }}</option>
                {% endfor %}
            </select>
            <button onclick="runAnalysis()" class="bg-green-600 text-black px-6 py-2 font-bold btn-glow">ANALYZE</button>
        </div>

        <div id="capture-area" class="bg-black p-6 neon-border hidden">
            <div class="flex justify-between border-b border-green-900 pb-2 mb-4">
                <div>
                    <h2 id="res-market" class="text-xl font-bold">MARKET</h2>
                    <p class="text-xs">TANGGAL: <span id="current-date"></span></p>
                </div>
                <div class="text-right">
                    <p class="text-xs text-gray-500">RESULT TERAKHIR</p>
                    <p id="res-last" class="text-3xl font-bold tracking-widest text-white">0000</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 text-sm">
                <div class="border border-green-900 p-2">
                    <p class="text-gray-500">CORE 2D BELAKANG</p>
                    <p id="res-core" class="text-lg font-bold">--</p>
                </div>
                <div class="border border-green-900 p-2">
                    <p class="text-gray-500">BBFS (30 DAYS)</p>
                    <p id="res-bbfs" class="text-lg font-bold text-yellow-400">--</p>
                </div>
                <div class="border border-green-900 p-2">
                    <p class="text-gray-500">AS + KOP (INDEX)</p>
                    <p id="res-depan" class="text-lg font-bold">--</p>
                </div>
                <div class="border border-green-900 p-2">
                    <p class="text-gray-500">KOP + KEPALA (ML)</p>
                    <p id="res-tengah" class="text-lg font-bold">--</p>
                </div>
                <div class="border border-green-900 p-2">
                    <p class="text-gray-500">SHIO UTAMA</p>
                    <p id="res-shio" class="text-lg font-bold">--</p>
                </div>
                <div class="border border-green-900 p-2">
                    <p class="text-gray-500">SHIO MACAU</p>
                    <p id="res-macau" class="text-lg font-bold">--</p>
                </div>
            </div>

            <div class="mt-4 p-2 bg-green-900/20 border border-green-700">
                <p class="text-xs text-gray-400">CADANGAN TWIN / SHADOW:</p>
                <p id="res-twin" class="font-bold"></p>
            </div>
            
            <p class="text-[8px] text-center mt-6 opacity-30">AUTO-GENERATED BY MAMANG AI ANALYTICS SYSTEM 2026</p>
        </div>

        <button id="snap-btn" onclick="takeScreenshot()" class="mt-4 w-full border border-green-500 p-2 hidden hover:bg-green-500 hover:text-black transition">DOWNLOAD RESULT (SCALE X3)</button>
    </div>

    <script>
        async function runAnalysis() {
            const m = document.getElementById('market').value;
            const res = await fetch('/analyze', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `market=${m}`
            });
            const data = await res.json();
            
            if(data.status === "success") {
                document.getElementById('capture-area').classList.remove('hidden');
                document.getElementById('snap-btn').classList.remove('hidden');
                document.getElementById('res-market').innerText = data.market;
                document.getElementById('res-last').innerText = data.last;
                document.getElementById('res-core').innerText = data.data.core;
                document.getElementById('res-bbfs').innerText = data.data.bbfs;
                document.getElementById('res-depan').innerText = data.data.depan;
                document.getElementById('res-tengah').innerText = data.data.tengah;
                document.getElementById('res-shio').innerText = data.data.shio;
                document.getElementById('res-macau').innerText = data.data.macau;
                document.getElementById('res-twin').innerText = data.data.twin;
                document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID');
            } else {
                alert("Gagal ambil data. Cek koneksi.");
            }
        }

        function takeScreenshot() {
            const element = document.getElementById('capture-area');
            html2canvas(element, {
                scale: 3,
                backgroundColor: "#0a0a0a",
                logging: false
            }).then(canvas => {
                const a = document.createElement('a');
                a.href = canvas.toDataURL("image/png");
                a.download = `Mamang_Result_${document.getElementById('res-market').innerText}.png`;
                a.click();
            });
        }
    </script>
</body>
</html>
