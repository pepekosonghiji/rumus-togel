<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAMANG TECH V7.8 | ABSOLUTE SYNC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #020617; --neon: #22d3ee; --accent: #f59e0b; }
        body { background: var(--bg); color: #f8fafc; font-family: 'Rajdhani', sans-serif; background-image: radial-gradient(circle at top, #1e293b 0%, #020617 100%); min-height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; margin-bottom: 15px; }
        .neon-text { font-family: 'Orbitron'; background: linear-gradient(to right, var(--neon), #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }
        .num-main { font-family: 'Orbitron'; font-size: 2rem; color: #fff; text-shadow: 0 0 10px var(--neon); letter-spacing: 5px; }
        .btn-run { background: linear-gradient(135deg, #0891b2, #4f46e5); border: none; color: white; font-weight: bold; padding: 15px; border-radius: 12px; width: 100%; font-family: 'Orbitron'; }
        .label-tech { font-size: 0.65rem; color: #94a3b8; letter-spacing: 2px; font-weight: 700; display: block; margin-bottom: 5px; text-transform: uppercase; }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="text-center mb-4">
        <h1 class="neon-text">MAMANG TECH V7.8</h1>
        <p class="text-secondary small fw-bold">ML • MB • ID • TY • SHIO SYNC</p>
    </div>

    {% if not logged_in %}
    <div class="col-md-5 mx-auto glass text-center">
        <input type="password" id="key" class="form-control bg-dark text-white border-0 py-3 mb-3 text-center" placeholder="LICENSE KEY">
        <button class="btn btn-run" onclick="login()">AUTHORIZE</button>
    </div>
    {% else %}
    <div class="col-lg-6 mx-auto">
        <div class="glass">
            <select id="market" class="form-select bg-dark text-white border-0 py-3 mb-3">
                {% for m in markets %}<option value="{{m}}">{{m}}</option>{% endfor %}
            </select>
            <button class="btn btn-run" onclick="run()" id="btnGo">EXECUTE ANALYSIS</button>
        </div>

        <div id="resultArea" style="display:none;">
            <div class="glass text-center" style="border-bottom: 3px solid var(--neon);">
                <h3 id="vMarketHeader" class="neon-text mb-2"></h3>
                <div class="d-flex justify-content-center gap-2">
                    <span class="badge bg-dark border border-info">LAST: <b id="vLast" class="text-white"></b></span>
                    <span class="badge bg-success" id="vShio"></span>
                </div>
            </div>

            <div class="glass">
                <div class="p-3 bg-dark rounded border border-info mb-3 text-center">
                    <span class="label-tech" style="color:var(--neon)">CORE 2D BOM (V7.3 PATTERN)</span>
                    <div id="vCore" class="num-main"></div>
                </div>
                <div class="p-3 bg-black rounded border border-warning text-center">
                    <span class="label-tech" style="color:var(--accent)">ULTIMATE BBFS</span>
                    <div id="vBbfs" class="num-main" style="color:var(--accent);"></div>
                </div>
            </div>
        </div>
    </div>
    {% endif %}
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    function login() { $.post('/login', {key:$('#key').val()}, () => location.reload()); }
    function run() {
        const mkt = $('#market').val();
        $('#btnGo').prop('disabled', true).text('SYNCING...');
        $.post('/analyze', {market: mkt}, (d) => {
            $('#btnGo').prop('disabled', false).text('EXECUTE ANALYSIS');
            if(d.error) { alert(d.error); return; }
            $('#vMarketHeader').text(d.market);
            $('#vLast').text(d.last);
            $('#vShio').text("SHIO: " + d.data.shio);
            $('#vCore').text(d.data.core);
            $('#vBbfs').text(d.data.bbfs);
            $('#resultArea').fadeIn();
        });
    }
</script>
</body>
</html>
